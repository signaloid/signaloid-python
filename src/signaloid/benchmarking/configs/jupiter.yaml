# configs/jupiter.yaml — benchmarking_automation sweep, Jupiter only.
# Pass with:
#   benchmarking_automation --config configs/jupiter.yaml \
#       --path-to-application <demo>

# Experiment matrix. Jupiter order is kept <= 32: the per-dimension
# order is bounded by max_jupiter_size below, and the swept sizes are
# capped to match, since Jupiter representations blow up at higher orders.
representation_types: [Jupiter]
representation_sizes: [8, 16, 32]
correlations: [Disabled, Autocorrelation]
reporting_methods: [Mean, Quantile-95, Quantile-99]

# Per-dimension Jupiter order cap (sets MAX_JUPITER_LIMIT at
# build time). Keep in lockstep with the largest representation_sizes value.
max_jupiter_size: 32

# Distance / EMCC settings.
# NOTE: keys are argparse dest names, not CLI flag spellings —
# --num-adversaries has dest n_adversaries, so the key is n_adversaries.
distance_type: Wasserstein-1
use_binned_uxhw: true
use_clt: true
n_adversaries: 100

# Ground-truth and adversary sizing.
ground_truth_size: 1000000
ground_truth_type: MonteCarlo
adversary_mc_size: 1000000
adversary_max_size_scalar: 100000
max_num_weighted_samples: 1

# Plotting controls (all default off — enable only what you need).
plot_distance_vs_asymptotic: false
plot_adversary_distances: false
plot_representative_mc: false
