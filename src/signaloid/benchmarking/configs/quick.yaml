# configs/quick.yaml — small, fast benchmarking_automation matrix.
# A minimal sweep for smoke-tests and local iteration.
# Pass with:
#   benchmarking_automation --config configs/quick.yaml \
#       --path-to-application <demo>

# Experiment matrix (small).
representation_types: [Athens]
representation_sizes: [16, 64]
correlations: [Disabled]
reporting_methods: [Mean]

# Distance / EMCC settings.
# NOTE: keys are argparse dest names, not CLI flag spellings —
# --num-adversaries has dest n_adversaries, so the key is n_adversaries.
distance_type: Wasserstein-1
use_binned_uxhw: true
use_clt: false
n_adversaries: 10

# Ground-truth and adversary sizing (small for speed).
ground_truth_size: 10000
ground_truth_type: MonteCarlo
adversary_mc_size: 10000

# Plotting controls (all default off).
plot_distance_vs_asymptotic: false
plot_adversary_distances: false
plot_representative_mc: false
