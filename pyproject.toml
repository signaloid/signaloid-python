[tool.poetry]
name = "signaloid"
version = "0.0.0"
description = ""
authors = [
	"Signaloid <info@signaloid.com>"
]

packages = [
	{ include = "signaloid", from = "src" }
]


[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"


[tool.poetry.group.dev.dependencies]
wheel = "^0.46.3"
types-toml = "^0.10.8.20240310"
pytest = "^9.0.3"
mypy = "^1.19.1"
flake8 = "^7.3.0"
toml = "^0.10.2"
black = "^26.3.1"
pandas-stubs = "^2.2.0.240218"
types-tqdm = "^4.66.0.20240106"
types-tabulate = "^0.9.0"
types-PyYAML = "^6.0.0"

[build-system]
requires = ["poetry-core>=1.9.1", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry.dependencies]
python = ">=3.10"
numpy = [
	{ version = ">=2.0.0", python = ">=3.10,<3.13" },
	{ version = ">=2.1.0", python = ">=3.10,<3.14" },
	{ version = ">=2.4.1", python = ">=3.11,<3.15" },
]
matplotlib = [
	{ version = ">=3.9.0", python = ">=3.10,<3.13" },
	{ version = ">=3.10.0", python = ">=3.10,<3.14" },
	{ version = ">=3.10.5", python = ">=3.10,<3.15" },
]
pillow = ">=12.2.0"
pyyaml = ">=6.0.0"
scipy = [
	{ version = ">=1.13.0,<1.16.0", python = ">=3.10,<3.11" },
	{ version = ">=1.14.0", python = ">=3.11" },
]


[tool.poetry.extras]
sheets = ["gspread", "google-api-python-client", "oauth2client"]

[tool.poetry.scripts]
signaloid-uxdata-toolkit = "signaloid.uxdata_toolkit:main"

[tool.mypy]
warn_unused_configs = true
strict = true
disallow_any_generics = false
python_version = "3.10"
exclude = '(^|/)\.venv/'
# `signaloid` is a PEP 420 namespace package, so it has no top-level `py.typed`
# marker. Resolve it from the source tree (via `mypy_path`) rather than as an
# installed distribution, so `mypy -p signaloid` type-checks the sources
# directly instead of failing on the absent namespace-level marker.
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
	"signaloid.distributional_information_plotting.*",
	"signaloid.distributional.*",
	"signaloid.circuitpython.*",
]
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_unused_ignores = false
check_untyped_defs = false
strict_equality = false
